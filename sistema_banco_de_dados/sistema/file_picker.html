<div class="upload-field"><span class="upload-label">{{ picker_label|default('Arquivo CSV ou Excel *') }}</span><label class="file-picker" data-file-picker><input name="arquivo" type="file" accept=".csv,.xlsx" required aria-label="{{ picker_label|default('Arquivo CSV ou Excel') }}" aria-describedby="file-help"><span class="file-picker-icon" aria-hidden="true">⇧</span><span class="file-picker-info"><strong data-file-title>Selecione ou arraste seu arquivo</strong><small data-file-description>CSV ou Excel .xlsx · Até 50 MB</small></span><span class="file-picker-button" data-file-button>Escolher arquivo</span><span class="file-picker-error" data-file-error role="status"></span></label><small id="file-help">{{ picker_help|default('Até 300.000 registros por arquivo. A primeira linha deve ter os nomes das colunas.') }}</small></div>
